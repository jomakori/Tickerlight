<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tickerlight · ops console (sample data, paper only)</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- App shell: sidebar nav (desktop) / bottom tab bar (<=900px), per T1 -->
<div class="shell">
  <aside class="side">
    <div class="brand" aria-hidden="true">Tickerlight <span>ops</span></div>
    <nav class="tabs" role="tablist" aria-orientation="vertical" aria-label="Sections">
      <button type="button" role="tab" id="tab-overview" aria-controls="p-overview" aria-selected="true" data-tab="overview"><span class="tl">Overview</span></button>
      <button type="button" role="tab" id="tab-journal" aria-controls="p-journal" aria-selected="false" data-tab="journal" tabindex="-1"><span class="tl">Journal</span></button>
      <button type="button" role="tab" id="tab-calibration" aria-controls="p-calibration" aria-selected="false" data-tab="calibration" tabindex="-1"><span class="tl">Calibration</span></button>
      <button type="button" role="tab" id="tab-risk" aria-controls="p-risk" aria-selected="false" data-tab="risk" tabindex="-1"><span class="tl">Risk state</span></button>
    </nav>
    <div class="sess" id="sess" aria-label="Session"></div>
  </aside>

  <div class="main">
    <header class="top">
      <div id="chips" style="display:contents"></div>
      <!-- Hard requirement: non-dismissible paper-only disclosure, always visible -->
      <span class="disc" role="note">Sample data · paper only</span>
    </header>
    <main>
      <section id="p-overview" role="tabpanel" aria-labelledby="tab-overview"></section>
      <section id="p-journal" role="tabpanel" aria-labelledby="tab-journal" hidden></section>
      <section id="p-calibration" role="tabpanel" aria-labelledby="tab-calibration" hidden></section>
      <section id="p-risk" role="tabpanel" aria-labelledby="tab-risk" hidden></section>
    </main>
  </div>
</div>

<!-- T7 GATED: confirm dialog markup kept inert; arm/kill flows are not wired in v1 -->
<dialog id="dlg" aria-labelledby="dlg-t">
  <h3 id="dlg-t"></h3>
  <p id="dlg-b" class="tx2" style="margin:0"></p>
  <div class="acts">
    <button type="button" class="btn" id="dlg-no">Cancel</button>
    <button type="button" class="btn" id="dlg-yes"></button>
  </div>
</dialog>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
