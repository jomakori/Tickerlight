<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Level line (the threshold) -->
  <path d="M 70 275 L 442 275 L 442 295 L 70 295 Z" fill="#E8EDE6"/>

  <!-- Rising wedge (trapezoid): wide base, converges upward but truncated at the level -->
  <path d="M 165 400 L 347 400 L 290 295 L 222 295 Z" fill="#E8EDE6"/>

  <!-- Lime crossing beam: the light at the intersection (rendered last, appears on top) -->
  <path d="M 222 275 L 290 275 L 290 295 L 222 295 Z" fill="#D2F23C"/>
</svg>
