<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Tickerlight — every trade explained, every AI decision scored">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="55%" stop-color="#101821"/>
      <stop offset="100%" stop-color="#0d141c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ea44f" stop-opacity="0"/>
      <stop offset="45%" stop-color="#2ea44f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2ea44f" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#glow)"/>

  <g opacity="0.5">
    <polyline points="820,215 858,196 896,203 934,168 972,178 1010,139 1048,150 1086,116 1124,126 1162,92"
              fill="none" stroke="#2ea44f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="820,236 858,228 896,232 934,213 972,219 1010,199 1048,206 1086,186 1124,192 1162,172"
              fill="none" stroke="#58a6ff" stroke-width="2" stroke-opacity="0.55" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="72" y="128" fill="#e6edf3" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-1.5">Tickerlight</text>
  <text x="74" y="180" fill="#9db2c6" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="400">Every trade explained. Every AI decision scored.</text>
  <rect x="74" y="206" width="150" height="3" fill="url(#rule)"/>
  <text x="74" y="244" fill="#6e8399" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="1.2">GO · TEMPL · HTMX · SINGLE BINARY</text>
</svg>
