---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: end-of-file-fixer
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: local
    hooks:
      - id: templ-generate
        name: templ generate (generated Go in sync)
        entry: >
          bash -c 'templ generate >/dev/null &&
          git diff --quiet -- "*.go"'
        language: system
        files: \.templ$
        pass_filenames: false
      - id: gofmt
        name: gofmt (staged Go files are formatted)
        entry: >
          bash -c 'bad=$(gofmt -l "$@");
          if [ -n "$bad" ]; then
          printf "gofmt needed:\n%s\n" "$bad"; exit 1; fi' --
        language: system
        files: \.go$
