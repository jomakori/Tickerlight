---
name: Release

# One workflow per release, run on every merge to main and dispatchable by hand for the merge
# that did not release. svu derives the next version from the tags and conventional commits, the
# tag is pushed here, the image is built and pushed from it, and a second job moves the prod pin
# in gke_GitOps — so version, image and pin are decided in one place instead of a maintainer
# tagging by hand and then editing the chart by hand.

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out the full history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install svu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download -R caarlos0/svu -p 'svu_*_linux_amd64.tar.gz' -D "$RUNNER_TEMP/svu" --clobber
          tar -xzf "$RUNNER_TEMP"/svu/*.tar.gz -C /usr/local/bin svu
          svu --version

      - name: Tag the next version
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current="$(svu current)"
          next="$(svu next)"
          echo "current=$current next=$next" >> "$GITHUB_STEP_SUMMARY"
          if [ "$current" = "$next" ]; then
            # An earlier run may have tagged the version and died before publishing it.
            if git rev-parse -q --verify "refs/tags/$current" >/dev/null \
              && ! gh release view "$current" >/dev/null 2>&1; then
              echo "Resuming unpublished $current." >> "$GITHUB_STEP_SUMMARY"
              echo "tag=$current" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "No releasable commits since $current — nothing to tag."
            exit 0
          fi
          git tag "$next"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.tag.outputs.tag != ''
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.tag.outputs.tag != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.tag.outputs.tag != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # GHCR paths are lowercase; the repo is jomakori/Tickerlight. Keep the v: the
          # chart pins tags with it.
          tags: |
            ghcr.io/jomakori/tickerlight:${{ steps.tag.outputs.tag }}
            ghcr.io/jomakori/tickerlight:latest
          cache-from: type=registry,ref=ghcr.io/jomakori/tickerlight:buildcache
          cache-to: type=registry,ref=ghcr.io/jomakori/tickerlight:buildcache,mode=max

      - name: Publish the release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.tag.outputs.tag }}" --generate-notes --latest

  pin-production:
    name: Pin Production
    needs: build-and-push
    if: needs.build-and-push.outputs.tag != ''
    runs-on: ubuntu-26.04
    steps:
      - name: Move the prod pin
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          set -euo pipefail
          gitops="$(mktemp -d)"
          git clone --depth 1 "https://x-access-token:${GITOPS_TOKEN}@github.com/jomakori/gke_GitOps.git" "$gitops"
          values="$gitops/apps/helm/values.yaml"
          yq -i '.tickerlight.environments.production.tag = strenv(TAG)' "$values"
          cd "$gitops"
          if git diff --quiet; then
            echo "tickerlight production already pinned to ${TAG}"
            exit 0
          fi
          git -c user.name="tickerlight-release[bot]" -c user.email="release@users.noreply.github.com" \
            commit -q -am "chore(apps): pin tickerlight prod to ${TAG}"
          git push -q origin HEAD:main
          echo "pinned tickerlight production to ${TAG}"
