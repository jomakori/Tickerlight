name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4.0.1

      - name: Fetch Doppler Secrets
        id: doppler
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          inject-env-vars: true

      - name: Install svu
        run: |
          gh release download -R caarlos0/svu -p 'svu_*_linux_amd64.tar.gz' \
            -D "$RUNNER_TEMP/svu" --clobber
          tar -xzf "$RUNNER_TEMP"/svu/*.tar.gz -C /usr/local/bin svu
          svu --version

      - name: Tag the next version
        id: tag
        run: |
          set -euo pipefail
          current="$(svu current)"
          next="$(svu next)"
          if [ "$current" = "$next" ]; then
            if git rev-parse -q --verify "refs/tags/$current" >/dev/null \
              && ! gh release view "$current" >/dev/null 2>&1; then
              echo "version=$current" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "No releasable commits since $current."
            exit 0
          fi
          git tag "$next"
          git push origin "$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.tag.outputs.version != ''
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.tag.outputs.version != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ steps.doppler.outputs.GITHUB_TOKEN }}

      - name: Build and push the image
        if: steps.tag.outputs.version != ''
        env:
          TAG: ${{ steps.tag.outputs.version }}
          IMAGE: ghcr.io/jomakori/tickerlight
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:latest" \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max" \
            --push .

      - name: Publish the release
        if: steps.tag.outputs.version != ''
        env:
          TAG: ${{ steps.tag.outputs.version }}
        run: gh release create "$TAG" --generate-notes --latest

  deploy:
    name: Deploy Release
    needs: build
    if: needs.build.outputs.version != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Fetch Doppler Secrets
        id: doppler
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}

      - name: Checkout the GitOps repo
        uses: actions/checkout@v7
        with:
          repository: jomakori/gke_GitOps
          token: ${{ steps.doppler.outputs.GITHUB_TOKEN }}
          ref: main
          path: gitops

      - name: Pin the production tag
        env:
          TAG: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          yq -i '.tickerlight.environments.production.tag = strenv(TAG)' \
            gitops/apps/helm/values.yaml
          cd gitops
          if git diff --quiet; then
            echo "tickerlight production already pinned to ${TAG}"
            exit 0
          fi
          git -c user.name="tickerlight-release[bot]" \
            -c user.email="release@users.noreply.github.com" \
            commit -q -am "chore(apps): pin tickerlight prod to ${TAG}"
          git push -q origin HEAD:main
          echo "pinned tickerlight production to ${TAG}"
