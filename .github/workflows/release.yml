---
name: Release

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: |
          # GHCR paths are lowercase; the repo is jomakori/Tickerlight.
          REGISTRY="ghcr.io/jomakori/tickerlight"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Keep the v: the chart pins tags with it (v0.1.0).
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tags=${REGISTRY}:${TAG},${REGISTRY}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${REGISTRY}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=ghcr.io/jomakori/tickerlight:buildcache
          cache-to: type=registry,ref=ghcr.io/jomakori/tickerlight:buildcache,mode=max
