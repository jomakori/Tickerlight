name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: build, vet, test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install templ
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/a-h/templ)
          go install "github.com/a-h/templ/cmd/templ@${version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check generated templ files are in sync
        run: |
          templ generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "templ generate changed files; commit the regenerated output:"
            git status --porcelain
            exit 1
          fi

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt required on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1

      - name: Test with race detector
        run: go test ./internal/... -count=1 -race
